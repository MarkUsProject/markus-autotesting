version: 2
updates:
  - package-ecosystem: pip
    directory: "/client"  # requirements.txt and requirements-dev.txt
    schedule:
      interval: "monthly"
    groups:
      client-dev-dependencies:
        patterns:
          - "fakeredis"
          - "pytest"
          - "pytest-cov"
  - package-ecosystem: pip
    directory: "/server"  # requirements.txt and requirements-dev.txt
    schedule:
      interval: "monthly"
    groups:
      server-dev-dependencies:
        patterns:
          - "fakeredis"
          - "pytest-cov"
