name: Autotester tests
on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
  push:
    branches:
      - master
jobs:
  test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version:
          - 3.11
          - 3.12
          - 3.13
          - 3.14
          - 3.15
        test-dir:
          - client
          - server
    name: ${{ matrix.test-dir }} tests with python ${{ matrix.python-version }}
    env:
      AUTOTESTER_CONFIG: ${{ github.workspace }}/server/autotest_server/tests/fixtures/test_config.yml
    steps:
      - uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install python packages
        working-directory: ${{ matrix.test-dir }}
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Install tester packages
        if: matrix.test-dir == 'server'
        run: python -m pip install nbformat PyPDF2 -r server/autotest_server/testers/jupyter/requirements.txt
      - name: Create users
        run: |
          sudo adduser --disabled-login --no-create-home fake_user
          sudo adduser --disabled-login --no-create-home fake_user_2
      - name: Make the test config private
        run: chmod 600 $AUTOTESTER_CONFIG
      - name: run tests
        working-directory: ${{ matrix.test-dir }}
        run: pytest --cov --cov-report=term --cov-report=lcov
      - name: Coveralls Parallel
        if: matrix.python-version == '3.13'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: ${{ matrix.test-dir }}
          parallel: true
          file: ${{ matrix.test-dir }}/coverage.lcov
          base-path: ${{ matrix.test-dir }}

  finish:
    needs: [test]
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: write
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
          carryforward: "client,server"
